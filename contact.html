<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

  <title>サイト名</title>
  <meta name="description" content="サイトの説明">
  <meta property="og:title" content="サイトタイトル">
  <meta property="og:type" content="website">
  <meta property="og:image" content="">
  <meta property="og:description" content="サイトの説明">
  <meta property="og:site_name" content="サイト名">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="./images/icon/favicon/favicon.ico" sizes="16x16 32x32 48x48">
  <!-- TODO: 実際に表示させる -->
  <link rel="preload" href="./images/test.png" as="image" type="image/png" />
  <link rel="stylesheet" href="./css/reset.css"/>
  <link rel="stylesheet" href="./css/grid-page-layout.css"/>
  <!-- TODO: @mediaのレスポンシブ用css -->
  <link rel="stylesheet" href="./css/style.css"/>
  <script type="module" src="./js/index.js" defer></script>
</head>
<body class="contact-page">
  <header>
    <div class="site-logo-field">
      <a class="nav-link" href="./index.html">
        <svg class="site-logo-svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
          <use class="site-logo" href="./images/icon/sample/site-logo.svg#site-logo" x="0" y="0" fill="" stroke="none"></use>
        </svg>
        <h1 class="site-name">サイト名</h1>
      </a>
    </div>
    <div class="global-nav">
      <nav class="nav-link-field">
        <a class="nav-link" href="./index.html">ホーム</a>
        <a class="nav-link" href="./about.html">企業案内</a>
        <a class="nav-link" href="./news.html">ニュース</a>
        <a class="nav-link" href="./recruit.html">採用情報</a>
        <a class="nav-link" href="./contact.html">お問い合わせ</a>
      </nav>
    </div>
    <button class="hamburger-menu-button" type="button">
      <svg class="hamburger-menu-svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
        <use href="./images/icon/sample/hamburger-menu.svg#hamburger-menu" x="0" y="0" fill="" stroke="none"></use>
      </svg>
    </button>
  </header>
  <main>
    <section id="main-section-contact" class="main-section-contact">
      <div class="page-title-field">
        <h2>お問合せ</h2>
        <p>以下のフォームに必要事項をご記入の上、送信してください。</p>
      </div>
      <form action="/submit-contact" method="post">
        <div class="form-card">
          <div>
            <label for="user-name">お名前<span class="required">必須</span></label>
            <input type="text" id="user-name" name="user_name" placeholder="例）山田 太郎" required>
            <span class="error-message"><span class="asterisk-mark">※</span>必須項目です</span>
          </div>
          <div>
            <label for="user-email">メールアドレス<span class="required">必須</span></label>
            <input type="email" id="user-email" name="user_email" placeholder="例）example@example.com" required>
            <span class="error-message"><span class="asterisk-mark">※</span>必須項目です</span>
          </div>
          <div>
            <label for="user-tel">電話番号<span class="optional">任意</span></label>
            <input type="tel" id="user-tel" name="user_tel" placeholder="例）09012345678">
            <span class="error-message"><span class="asterisk-mark"></span></span>
          </div>
          <div>
            <label for="subject">件名<span class="optional">任意</span></label>
            <input type="text" id="subject" name="subject" placeholder="件名をご入力ください。">
            <span class="error-message"><span class="asterisk-mark"></span></span>
          </div>
          <div>
            <label for="message">メッセージ本文<span class="required">必須</span></label>
            <textarea id="message" name="message" rows="6" placeholder="お問い合わせ内容をご入力ください。" required></textarea>
            <span class="error-message"><span class="asterisk-mark">※</span>必須項目です</span>
          </div>
          <div class="form-button-field">
            <input type="submit" value="送信する" class="button button--lift button--lg button--border-circle">
          </div>
        </div>
      </form>
    </section>
  </main>
  <footer>
    <div class="copy">&copy;Company Co., Ltd.</div>
  </footer>
</body>
</html>
